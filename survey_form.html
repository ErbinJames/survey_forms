<!DOCTYPE html>
    <head>
        <title>Survey Form</title>
    </head>
    <body>
        <h1>Survey Form</h1>
        <form>
            <div class="personal-details">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname">
                
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email">
            </div>
           
            <div class="evaluation">
                <p>How satisfied are you with our service?</p>
                <label>
                    <input type="radio" name="option" value="verysatisfied">Very Satisfied
                </label>
                <label>
                    <input type="radio" name="option" value="satisfied">Satisfied
                </label>
                <label>
                     <input type="radio" name="option" value="neutral">Neutral
                </label>
                <label>
                    <input type="radio" name="option" value="dissatisfied">Dissatisfied
                </label>
                <label>
                    <input type="radio" name="option" value="verydissatisfied">Very Dissatisfied
                </label>
            </div>

            <div class="features">
                <p>What features do you value most?</p>
                <label>
                    <input type="checkbox" name="choices" value="easeofuse">Ease of Use
                </label>
                <label>
                    <input type="checkbox" name="choices" value="design">Design
                </label>
                <label>
                    <input type="checkbox" name="choices" value="customersupport">Customer Support
                </label>
            </div>
            
            <div class="position">
                <p>What best describes you?</p>
                <select id="option" name="option">
                    <option value="student">Student</option>
                    <option value="professional">Professional</option>
                    <option value="hobbyist">Hobbyist</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="feedback-area">
                <p>Additional Feedback</p>
                <textarea id="message" name="message"></textarea>
            </div>

            <input type="submit" value="Submit">
        </form>    
    </body>
</html>
